<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SSO-Lite</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="brand">🖨️ Print Wizard</div>
</header>
<main>
  <div id="connBlock" class="card">
    <div class="row"><span>SSO-Lite</span><span id="conn" class="pill warn">checking…</span></div>
    <div class="row"><span>Address</span><span id="addr" class="mono">—</span></div>
    <div class="row"><span>Slot 1</span><span id="slot">—</span></div>
  </div>
  <p class="muted">
    Open any model on <strong>makerworld.com</strong> and look for the
    <em>Print Wizard</em> button.
  </p>
  <div class="actions">
    <button id="optionsBtn" class="ghost">Settings</button>
    <button id="openSso" class="primary">Open SSO-Lite UI</button>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
